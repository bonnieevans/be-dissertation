# Master configuration for the MSOA-year new-build / house-price panel.
# Every tunable threshold used across src/ scripts should live here, not
# hardcoded in code.

study_period:
  main_panel_start_year: 2012        # raw housing data retained from
  main_panel_end_year: 2023
  regression_sample_start_year: 2016 # main_regression_sample flag
  regression_sample_end_year: 2023

geography:
  target_geography: MSOA21CD         # principal panel key (see plan: MSOA21
  reference_geography: MSOA11CD      # is the well-behaved join direction for
  england_only: true                 # transactions/new-builds; MSOA11CD kept
  england_prefix: "E"                # as a reference column via the crosswalk)
  msoa11_to_msoa21_required: true

transactions:
  old_new_filter: "N"                # established homes only
  min_price: 1
  min_floor_area_sqm: 1
  outlier_trim_pct_low: 0.5
  outlier_trim_pct_high: 99.5
  low_sales_count_threshold: 10      # kept for backward compatibility
  low_sales_count_thresholds: [10, 20, 30, 50]

newbuilds:
  transaction_type_value: "new dwelling"
  tenure_imputation_window_months: 24
  # Raw values confirmed by direct inspection of the deposited EPC source
  # (outputs/qa/epc_tenure_raw_distribution.csv) - both the current
  # "rented (...)" wording and the older "rental (...)" wording appear in
  # the data and must both be mapped, or they silently fall into UNKNOWN.
  tenure_groups:
    SOCIAL:
      - "rental (social)"
      - "rented (social)"
    PRIVATE_NONSOCIAL:
      - "owner-occupied"
      - "owner occupied"
      - "rental (private)"
      - "rented (private)"
    UNKNOWN:
      - "unknown"
      - "not defined - use in the case of a new dwelling for which the intended tenure in not known. it is not to be used for an existing dwelling"
      - "no data!"
      - ""

income:
  baseline_fye: 2012
  measure: "net income before housing costs"
  low_income_definition: "bottom_quartile"
  robustness_definition: "below_median"

# --- Which measures enter the interaction models (IMD 2015 revision) ---
# deprivation_moderator: imd_ex_housing | imd_ex_housing_living |
#                        imd_ex_income_housing | imd_income_rate
# income_moderator:      saie | imd_income_rate
# Sign convention: SAIE income higher = RICHER; every IMD measure higher =
# MORE DEPRIVED. Choosing imd_income_rate for both switches is refused.
moderators:
  deprivation_moderator: imd_ex_housing
  income_moderator: saie
  high_deprivation_quartile: 4       # high_deprivation_q4 = 1 if deprivation_quartile == 4

imd2015:
  expected_n_lsoa: 32844             # England LSOA11s
  expected_n_msoa11: 6791            # England MSOA11s
  deprived_deciles: [1, 2]           # national deciles 1-2 (bottom-20 shares)
  # 'published' = the File 7 domain ranks (computed by MHCLG from the
  # UNROUNDED scores; reproduce the official transformed scores in File 9 to
  # rounding). 'score' = re-rank the rounded published scores (creates large
  # tie blocks - kept only as a comparison).
  rank_source: published
  min_spearman_reproduction: 0.999   # hard stop: 7-domain recombination vs published IMD score
  # Exponential transform, Technical Report Appendix F:
  #   R = (N - rank + 1) / N  (1 = most deprived);  X = -23 ln(1 - R (1 - exp(-100/23)))
  exp_transform_constant: 23
  exp_transform_scale: 100
  # Real File 7 column names (trailing whitespace is stripped on load; the
  # working-age header has a trailing space in the source file).
  columns:
    lsoa: "LSOA code (2011)"
    overall_score: "Index of Multiple Deprivation (IMD) Score"
    overall_rank: "Index of Multiple Deprivation (IMD) Rank (where 1 is most deprived)"
    overall_decile: "Index of Multiple Deprivation (IMD) Decile (where 1 is most deprived 10% of LSOAs)"
    population_total: "Total population: mid 2012 (excluding prisoners)"
    population_working_age: "Working age population 18-59/64: for use with Employment Deprivation Domain (excluding prisoners)"
    domains:
      income:     {score: "Income Score (rate)", rank: "Income Rank (where 1 is most deprived)"}
      employment: {score: "Employment Score (rate)", rank: "Employment Rank (where 1 is most deprived)"}
      education:  {score: "Education, Skills and Training Score", rank: "Education, Skills and Training Rank (where 1 is most deprived)"}
      health:     {score: "Health Deprivation and Disability Score", rank: "Health Deprivation and Disability Rank (where 1 is most deprived)"}
      crime:      {score: "Crime Score", rank: "Crime Rank (where 1 is most deprived)"}
      barriers:   {score: "Barriers to Housing and Services Score", rank: "Barriers to Housing and Services Rank (where 1 is most deprived)"}
      living:     {score: "Living Environment Score", rank: "Living Environment Rank (where 1 is most deprived)"}
  # Published domain weights (Technical Report Table 3.1). They sum to 0.999,
  # and the published IMD uses them AS PUBLISHED (verified: reproduces the
  # official score to 0.0025). They are rescaled to sum to 1 ONLY for the
  # reduced variants below.
  domain_weights:
    income: 0.225
    employment: 0.225
    education: 0.135
    health: 0.135
    crime: 0.093
    barriers: 0.093
    living: 0.093
  variants:
    imd_ex_housing:         [income, employment, education, health, crime, living]   # drop Barriers (primary)
    imd_ex_housing_living:  [income, employment, education, health, crime]           # drop Barriers + Living Env (sensitivity)
    imd_ex_income_housing:  [employment, education, health, crime, living]           # drop Income + Barriers (use with SAIE)
  # File 9 (published exponentially transformed domain scores) - independent
  # check on the transform; reported, not a hard stop.
  file9_xlsx: data/raw/imd/imd2015/File_9_ID2015_transformed_domain_scores.xlsx

# Baseline accessibility (DfT Journey Time Statistics 2014, LSOA11 tables JTS0501-0508).
# Travel time = modelled minutes to the NEAREST destination of that type, AM peak (Tuesday in
# October, 7-10am for public transport), capped at 120 (journey cannot be made within 2 hours).
# Column names are the real DfT headers (printed and checked in 11c_prepare_accessibility.py).
# NOTE: jts0507 (food stores) carries the header prefix "Town" - a labelling error in the DfT file;
# it is identified by the table title, not the header prefix.
accessibility:
  year: 2014
  expected_n_lsoa: 32844
  expected_n_msoa11: 6791
  time_cap_minutes: 120
  data_dir: data/raw/transport/jts2014/extracted
  modes:
    pt:  PTt     # public transport / walk
    car: Cart
  services:
    employment:        {file: jts0501.xls, title_contains: "employment centres", prefix: "500Emp", pop: Empl_pop, users: "economically active 16-74"}   # centres with 500-4,999 jobs (DfT key-services definition)
    primary_school:    {file: jts0502.xls, title_contains: "Primary Schools",    prefix: PS,     pop: PS_pop,    users: "population aged 5-10"}
    secondary_school:  {file: jts0503.xls, title_contains: "Secondary Schools",  prefix: SS,     pop: SS_pop,    users: "population aged 11-15"}
    further_education: {file: jts0504.xls, title_contains: "further education",  prefix: FE,     pop: FE_pop,    users: "population aged 16-19"}
    gp:                {file: jts0505.xls, title_contains: "GPs",                prefix: GP,     pop: GP_pop,    users: "all households"}
    hospital:          {file: jts0506.xls, title_contains: "hospitals",          prefix: Hosp,   pop: Hosp_pop,  users: "all households"}
    food_store:        {file: jts0507.xls, title_contains: "food stores",        prefix: Town,   pop: Town_pop,  users: "all households"}   # header prefix is mislabelled "Town"
    town_centre:       {file: jts0508.xls, title_contains: "town centres",       prefix: Town,   pop: Town_pop,  users: "all households"}
  town_centres_geojson: data/raw/landuse_access/town_centres_2004/English_Town_Centres_2004.geojson
  msoa11_pwc_geojson: data/raw/geography/msoa11_pwc/MSOA11_PWC_England_BNG.geojson

# Older DfT Accessibility Statistics 2011 (LSOA tables ACS0501-0508, 2001 LSOA codes). NOT comparable with the 2014
# series (different software/method; employment centres are LSOAs with >= 500 jobs, i.e. no upper limit).
# Header names carry a trailing footnote digit (e.g. "Pop_age5to101"), so columns are matched by prefix.
# Car time uses the "carnew" (Trafficmaster) columns; public transport = "PTtime".
accessibility_2011:
  data_dir: data/raw/transport/acs2011/extracted
  lsoa01_lsoa11_lookup: data/raw/geography/msoa_crosswalks/LSOA01_LSOA11_LAD11_EW_LU.csv
  expected_n_lsoa01: 32482
  services:
    employment:        {file: acs0501-2011.csv, pop_prefix: Empl_pop,       pt_prefix: emplPTtime, car_prefix: emplcarnewtime}
    primary_school:    {file: acs0502-2011.csv, pop_prefix: Pop_age5to10,   pt_prefix: psPTtime,   car_prefix: pscarnewtime}
    secondary_school:  {file: acs0503-2011.csv, pop_prefix: Pop_age11to15,  pt_prefix: ssPTtime,   car_prefix: sscarnewtime}
    further_education: {file: acs0504-2011.csv, pop_prefix: Pop_age16-19,   pt_prefix: fePTtime,   car_prefix: fecarnewtime}
    gp:                {file: acs0505-2011.csv, pop_prefix: All_households, pt_prefix: gpPTtime,   car_prefix: gpcarnewtime}
    hospital:          {file: acs0506-2011.csv, pop_prefix: All_households, pt_prefix: hospPTtime, car_prefix: hospcarnewtime}
    food_store:        {file: acs0507-2011.csv, pop_prefix: All_households, pt_prefix: supPTtime,  car_prefix: supcarnewtime}
    town_centre:       {file: acs0508-2011.csv, pop_prefix: All_households, pt_prefix: townPTtime, car_prefix: towncarnewtime}

# Spatial spillover exposure (neighbouring-MSOA construction, income and prices). See docs/spillover_exposure_methodology.md.
# Built by src/13b_prepare_spatial_spillovers.py. Neighbours are defined on the fixed 2011 MSOA geography.
spatial_spillovers:
  enabled: true
  geography: MSOA11
  primary_network: queen
  queen_attach_islands: true          # island MSOAs are attached to their nearest neighbour; edges flagged edge_type = island_fallback
  distance_radii_m: [5000, 10000]
  distance_decay_m: 3000              # proposed modelling choice, not an estimated parameter
  distance_max_m: 10000
  primary_construction_lag: 1
  compute_cross_lad: true
  compute_neighbour_prices: true
  compute_second_order: false
  boundaries_geojson: data/raw/geography/msoa11_boundaries/MSOA11_BGC_England.geojson
  centroids_geojson: data/raw/geography/msoa11_pwc/MSOA11_PWC_England_BNG.geojson

lagged_exposure:
  lags_years: [1, 2, 3]
  primary_treatment: newbuilds_lag1_per_1000       # PRIMARY treatment
  robustness_treatment: newbuilds_prev3yr_per_1000 # primary robustness variant

proximity:
  bands_metres: [500, 1000, 2000]
  enabled: true   # set false if reliable UPRN coordinates cannot be obtained

cpih:
  base_year: 2015

diagnostics:
  # Interaction terms are NOT precomputed/stored in the final panel (per the
  # user's instruction) - they are built on the fly wherever needed
  # (15_run_diagnostics.py, and at regression time) as
  # newbuilds_lag1_per_1000 * <zscore>.
  zscore_variables:
    - income_z
    - deprivation_z
    - social_rent_z
    - density_z
    - degree_share_z
    - unemployment_z
  interaction_variables:
    - newbuild_x_income
    - newbuild_x_deprivation
    - newbuild_x_socialrent
    - newbuild_x_density

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  outputs: outputs
